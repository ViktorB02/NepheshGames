<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#2a1818" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lordsofelzorn-site</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking fonts: loaded as print media, switched to all once fetched (display=swap is in the URL) -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"></noscript>

    <!-- Start the first map's GLB now, in parallel with the JS bundle. Same mobile/desktop rule as src/data/hotspots.js -->
    <script>
      (function () {
        var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'fetch';
        l.crossOrigin = 'anonymous';
        l.href = '%BASE_URL%' + (mobile ? 'WebScene3_m128.glb' : 'WebScene3_512.glb');
        document.head.appendChild(l);
      })();
    </script>

    <style>
      /* Early loading indicator: lives inside #root and is wiped when React mounts */
      #early-loader { position: fixed; inset: 0; background: #2a1818; display: flex; align-items: center; justify-content: center; }
      #early-loader div { width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(201,146,42,.25); border-top-color: #c9922a; animation: early-spin 1s linear infinite; }
      @keyframes early-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="background:#2a1818">
    <div id="root"><div id="early-loader"><div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
